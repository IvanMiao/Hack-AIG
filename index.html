<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>NEMESIS</title>
    <link rel="stylesheet" href="/src/styles/hud.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud">
      <section id="incantation" class="panel">
        <h1 class="title">NEMESIS</h1>
        <p class="tagline">One sentence. One boss. It remembers.</p>
        <textarea id="incantation-input" rows="2" maxlength="280"
          placeholder="Speak a nightmare into existence…"></textarea>
        <div class="row">
          <button id="summon-btn" class="primary">SUMMON</button>
          <button id="fallback-btn">Use a bound nightmare</button>
        </div>
        <p id="incantation-status" class="status"></p>
      </section>
      <section id="ritual" class="panel hidden">
        <p id="ritual-incantation" class="ritual-incantation"></p>
        <div class="cards">
          <article class="card" data-card="form"><header><h3>FORM</h3><span class="card-badge">forging</span></header><div class="card-body"></div></article>
          <article class="card" data-card="temper"><header><h3>TEMPER</h3><span class="card-badge">forging</span></header><div class="card-body"></div></article>
          <article class="card" data-card="voice"><header><h3>VOICE</h3><span class="card-badge">forging</span></header><div class="card-body"></div></article>
          <article class="card" data-card="arena"><header><h3>ARENA</h3><span class="card-badge">forging</span></header><div class="card-body"></div></article>
        </div>
        <div class="ritual-progress"><div id="ritual-progress-fill"></div></div>
        <p id="ritual-status" class="status"></p>
        <button id="enter-btn" class="primary" disabled>ENTER THE RIFT</button>
      </section>
      <section id="fight" class="panel hidden">
        <img id="portrait" class="portrait" alt="" />
        <div id="boss-bar"><span id="boss-name"></span><div class="bar"><div id="boss-hp"></div></div></div>
        <div id="player-bar"><div class="bar"><div id="player-hp"></div></div><div class="bar stamina"><div id="player-stamina"></div></div></div>
        <p id="subtitle" class="subtitle"></p>
        <div id="hit-vignette"></div>
        <p class="controls">WASD move · J / LMB light · K / RMB heavy · Space roll</p>
        <div id="outcome" class="hidden">
          <h2 id="outcome-title"></h2>
          <p id="outcome-line"></p>
          <div id="grudge" class="hidden"><span class="grudge-label">GRUDGE</span><p id="grudge-observation"></p><p id="grudge-patch"></p></div>
          <div class="row"><button id="retry-btn" class="primary">FIGHT AGAIN</button><button id="new-btn">New incantation</button></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
